name: apply-second-order-policy

on:
  push:
    branches:
      - fix/second-order-only

permissions:
  contents: write

jobs:
  apply-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/second-order-only
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Apply second-order-only policy
        run: python tools/second_order_policy.py --apply

      - name: Commit generated policy changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Second-order policy already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md dolfinx benchmarks examples
          git commit -m "有限元：生产管线固定二阶 Nédélec"
          git push origin HEAD:fix/second-order-only
