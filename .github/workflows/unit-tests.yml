name: unit-tests

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"

jobs:
  focused-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Enforce finite-element production policies
        run: |
          python tools/second_order_policy.py --check
          python tools/apply_magnetic6_production.py --check

      - name: Run waveform, receiver, and empymod magnetic-six regression tests
        run: |
          python -m pytest -q \
            tests/test_sources.py \
            tests/test_receivers.py \
            tests/test_average_receivers.py \
            tests/test_receiver_groups.py \
            tests/test_empymod_magnetic6.py \
            tests/test_empymod_waveform.py \
            tests/test_magnetic6_production_policy.py
