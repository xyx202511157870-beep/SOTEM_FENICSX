name: apply-magnetic6-production

on:
  push:
    branches:
      - feature/magnetic6-waveform-production

permissions:
  contents: write

jobs:
  apply-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/magnetic6-waveform-production
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Apply magnetic-six production policy
        run: |
          python tools/apply_magnetic6_production.py --apply
          python tools/apply_magnetic6_production.py --check
          python -m py_compile tools/apply_magnetic6_production.py dolfinx/sotem_pipeline.py

      - name: Commit generated production changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Magnetic-six production policy already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dolfinx/sotem_pipeline.py
          git commit -m "DOLFINx：增加 H 三分量与 dB/dt 三分量生产输出"
          git push origin HEAD:feature/magnetic6-waveform-production
