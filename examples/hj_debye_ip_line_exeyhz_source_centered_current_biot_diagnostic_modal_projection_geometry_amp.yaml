boundary:
  kind: none
coordinate_system: z_up
diagnostic_only: true
formulation: hj
magnetic_receiver_mode: current_biot
magnetic_recovery_subdivisions: 1

magnetic_recovery_source_history:
  kind: driven_recovery_source_moments
  driver_tau: 0.001
  response_taus:
    - 2.0837328684086323e-08
    - 2.0723941234701684e-08
    - 2.0634873733932435e-08
    - 2.0466477389267758e-08
    - 2.0316897700106635e-08
    - 2.021274552398084e-08
  source_moment_degrees: [0, 2]
  receiver_matrix: auto
  coefficients:
    - -9.835920999884617e-26
    - 2.7172516507166023e-23
    - -4.0259068217754615e-23
    - 9.769633474933843e-23
    - -3.4777371247527465e-06
    - 7.750686099242643e-06
    - 2.438385517455226e-14
    - -5.034529033511132e-14
    - 1.8358884712073458e-22
    - -3.6684068507060436e-22
    - 4.011210529620883e-05
    - 1.7431868311312747e-05

mesh:
  hx:
    - [80.0, 6, -1.2]
    - [5.0, 20]
    - [80.0, 6, 1.2]
  hy:
    - [80.0, 6, -1.2]
    - [5.0, 17]
    - [80.0, 6, 1.2]
  hz:
    - [80.0, 8]
    - [5.0, 7]
    - [1.0, 4]
    - [1.0, 1]
    - [80.0, 3]
  origin: [-1003.2723199999998, -1005.7723199999998, -680.0]

model:
  require_layer_boundary_alignment: true
  layers:
    - top: 1000000000.0
      bottom: 0.0
      sigma_infinity: 1.0e-8
    - top: 0.0
      bottom: -40.0
      sigma_infinity: 0.012
      debye_terms:
        - delta_sigma: 0.002
          tau: 0.001
    - top: -40.0
      bottom: -1000000000.0
      sigma_infinity: 0.036
      debye_terms:
        - delta_sigma: 0.006
          tau: 0.001

receiver_line:
  x: [-20.0, 0.0, 20.0]
  y: 10.0
  z: -0.5
  components: [Ex, Ey, Hz]

solver:
  type: pardiso

source:
  start: [-25.0, 0.0, -0.5]
  end: [25.0, 0.0, -0.5]
  current: 1.0
  face_projection: axis_aligned
  waveform:
    type: step_off
    off_time: 0.0
    on_value: 1.0

time_steps:
  - [1.0e-05, 100]
