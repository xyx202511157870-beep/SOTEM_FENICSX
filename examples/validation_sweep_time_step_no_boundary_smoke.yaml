cases:
  - name: dt_original_no_boundary
    overrides:
      boundary:
        kind: none
      magnetic_receiver_mode: current_biot
      magnetic_recovery_subdivisions: 1
      magnetic_recovery_polarization_scale: low_frequency_ratio

  - name: dt_1ms_no_boundary
    overrides:
      boundary:
        kind: none
      magnetic_receiver_mode: current_biot
      magnetic_recovery_subdivisions: 1
      magnetic_recovery_polarization_scale: low_frequency_ratio
      time_steps:
        - [0.001, 12]

  - name: dt_0p5ms_no_boundary
    overrides:
      boundary:
        kind: none
      magnetic_receiver_mode: current_biot
      magnetic_recovery_subdivisions: 1
      magnetic_recovery_polarization_scale: low_frequency_ratio
      time_steps:
        - [0.0005, 24]
