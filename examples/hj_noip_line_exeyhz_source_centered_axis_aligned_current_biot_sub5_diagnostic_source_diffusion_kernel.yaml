boundary:
  kind: none
coordinate_system: z_up
formulation: hj
magnetic_receiver_mode: current_biot
magnetic_recovery_subdivisions: 5

# Diagnostic-only replay of the source-neighborhood exponential kernel.
# Parameters are not a derived production law.
magnetic_recovery_source_history:
  kind: source_diffusion_kernel_source_moments
  amplitude: -1.106396079306176e-4
  tau_multiplier: 1.25
  amplitude_time: 1.0e-4
  source_moment_degrees: [0]
  receiver_matrix: auto

mesh:
  hx:
    - [80.0, 6, -1.2]
    - [5.0, 20]
    - [80.0, 6, 1.2]
  hy:
    - [80.0, 6, -1.2]
    - [5.0, 17]
    - [80.0, 6, 1.2]
  hz:
    - [80.0, 8]
    - [5.0, 7]
    - [1.0, 4]
    - [1.0, 1]
    - [80.0, 3]
  origin: [-1003.2723199999998, -1005.7723199999998, -680.0]

model:
  require_layer_boundary_alignment: true
  layers:
    - top: 1000000000.0
      bottom: 0.0
      sigma_infinity: 1.0e-8
    - top: 0.0
      bottom: -40.0
      sigma_infinity: 0.01
    - top: -40.0
      bottom: -1000000000.0
      sigma_infinity: 0.03

receiver_line:
  x: [-20.0, 0.0, 20.0]
  y: 10.0
  z: -0.5
  components: [Ex, Ey, Hz]

solver:
  type: pardiso

source:
  start: [-25.0, 0.0, -0.5]
  end: [25.0, 0.0, -0.5]
  current: 1.0
  face_projection: axis_aligned
  waveform:
    type: step_off
    off_time: 0.0
    on_value: 1.0

time_steps:
  - [1.0e-05, 100]
