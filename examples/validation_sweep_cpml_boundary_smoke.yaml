cases:
  - name: cpml_current_biot_lowfreq
    overrides:
      boundary:
        kind: cpml
        thickness_cells: 2
        sigma_max: 50.0
        alpha_max: 0.0
        kappa_max: 1.0
        power: 2.0
      magnetic_receiver_mode: current_biot
      magnetic_recovery_subdivisions: 1
      magnetic_recovery_polarization_scale: low_frequency_ratio

  - name: no_boundary_current_biot_lowfreq
    overrides:
      boundary:
        kind: none
      magnetic_receiver_mode: current_biot
      magnetic_recovery_subdivisions: 1
      magnetic_recovery_polarization_scale: low_frequency_ratio
