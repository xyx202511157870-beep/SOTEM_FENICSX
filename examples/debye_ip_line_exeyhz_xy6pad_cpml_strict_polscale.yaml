boundary:
  kind: cpml
  thickness_cells: 2
  sigma_max: 50.0
  alpha_max: 0.0
  kappa_max: 1.0
  power: 2.0
coordinate_system: z_up
initial_magnetic_field: ampere
magnetic_receiver_mode: current_biot
magnetic_recovery_polarization_scale: 1.0
magnetic_recovery_subdivisions: 5

mesh:
  hx:
    - [80.0, 6, -1.2]
    - [5.0, 20]
    - [80.0, 6, 1.2]
  hy:
    - [80.0, 6, -1.2]
    - [5.0, 16]
    - [80.0, 6, 1.2]
  hz:
    - [80.0, 8]
    - [5.0, 7]
    - [1.0, 4]
    - [0.5, 2]
    - [80.0, 3]
  origin: [-1003.2723199999998, -993.2723199999998, -680.0]

model:
  require_layer_boundary_alignment: true
  layers:
    - top: 1000000000.0
      bottom: 0.0
      sigma_infinity: 1.0e-8
    - top: 0.0
      bottom: -40.0
      sigma_infinity: 0.012
      debye_terms:
        - delta_sigma: 0.002
          tau: 0.001
    - top: -40.0
      bottom: -1000000000.0
      sigma_infinity: 0.036
      debye_terms:
        - delta_sigma: 0.006
          tau: 0.001

receiver_line:
  x: [-20.0, 0.0, 20.0]
  y: 10.0
  z: -0.5
  components: [Ex, Ey, Hz]

solver:
  type: pardiso

source:
  start: [-25.0, 0.0, -0.5]
  end: [25.0, 0.0, -0.5]
  current: 1.0
  waveform:
    type: step_off
    off_time: 0.0
    on_value: 1.0

time_steps:
  - [1.0e-05, 100]
