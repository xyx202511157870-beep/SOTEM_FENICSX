boundary:
  kind: none
coordinate_system: z_up
formulation: hj
magnetic_receiver_mode: current_biot
magnetic_recovery_subdivisions: 1

# Diagnostic only. These coefficients are fitted from
# outputs/source_history_matrix_scan_hj_current_biot_ip_residual_hz_line_source_moments_even02_orders1to6.json
# and must not be treated as a production source-history law.
magnetic_recovery_source_history:
  kind: prescribed_source_moments
  tau: 0.001
  max_order: 2
  source_moment_degrees: [0, 2]
  receiver_matrix: current_biot
  coefficients:
    - 0.00010969611852819514
    - 0.0000392427655625944
    - -0.00016304528947188741
    - -0.00008210285150831812
    - 0.000201107067539352
    - 0.00010798320873191394

mesh:
  hx:
    - [80.0, 6, -1.2]
    - [5.0, 20]
    - [80.0, 6, 1.2]
  hy:
    - [80.0, 6, -1.2]
    - [5.0, 16]
    - [80.0, 6, 1.2]
  hz:
    - [80.0, 8]
    - [5.0, 7]
    - [1.0, 4]
    - [0.5, 2]
    - [80.0, 3]
  origin: [-1003.2723199999998, -993.2723199999998, -680.0]

model:
  require_layer_boundary_alignment: true
  layers:
    - top: 1000000000.0
      bottom: 0.0
      sigma_infinity: 1.0e-8
    - top: 0.0
      bottom: -40.0
      sigma_infinity: 0.012
      debye_terms:
        - delta_sigma: 0.002
          tau: 0.001
    - top: -40.0
      bottom: -1000000000.0
      sigma_infinity: 0.036
      debye_terms:
        - delta_sigma: 0.006
          tau: 0.001

receiver_line:
  x: [-20.0, 0.0, 20.0]
  y: 10.0
  z: -0.5
  components: [Ex, Ey, Hz]

solver:
  type: pardiso

source:
  start: [-25.0, 0.0, -0.5]
  end: [25.0, 0.0, -0.5]
  current: 1.0
  waveform:
    type: step_off
    off_time: 0.0
    on_value: 1.0

time_steps:
  - [1.0e-05, 100]
