# empymod Hx/Hy/Hz + dBx/dt,dBy/dt,dBz/dt benchmark with a 5 us
# transmitter ramp. Observation times in the numerical NPZ are measured after
# the end of the ramp, matching time_origin: after_ramp in the DOLFINx pipeline.
coordinate_system: z_up

source:
  start: [-20.0, -7.0, -0.1]
  end: [20.0, 7.0, -0.1]
  current: 1.0
  waveform:
    type: linear_ramp_off
    t_off: 5.0e-6
    current_initial: 1.0
    current_final: 0.0

receiver:
  location: [13.0, 31.0, -0.2]

model:
  layers:
    - top: 1000000000.0
      bottom: 0.0
      sigma_infinity: 1.0e-8
    - top: 0.0
      bottom: -1000000000.0
      sigma_infinity: 0.01

# The validation CLI reads observation times from the numerical CSV/NPZ.
# Run with, for example:
#
# atem3d-validate-empymod-magnetic6 \
#   examples/empymod_validation_magnetic6_5us.yaml \
#   --numerical output/magnetic6_numerical.npz \
#   --depths 0 --resistivities 1e8,100 \
#   --waveform-quadrature-order 8 \
#   --output-dir output/empymod_magnetic6_5us
