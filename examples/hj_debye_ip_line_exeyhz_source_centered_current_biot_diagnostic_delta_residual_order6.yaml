boundary:
  kind: none
coordinate_system: z_up
formulation: hj
magnetic_receiver_mode: current_biot
magnetic_recovery_subdivisions: 1

magnetic_recovery_source_history:
  kind: prescribed_source_moments
  tau: 0.001
  max_order: 6
  source_moment_degrees: [0, 2]
  receiver_matrix: auto
  coefficients:
    - -0.00014459872398800598
    - -4.4947609173415475e-05
    - 0.0026667131182972923
    - 0.00079351545602146458
    - -0.027281093081644173
    - -0.0077576308388749614
    - 0.20915870756722682
    - 0.056926736559994799
    - -1.1327589647026324
    - -0.29780480777220525
    - 3.8666444389060906
    - 0.9900156757212506
    - -6.2662263998166905
    - -1.5723607803555584

mesh:
  hx:
    - [80.0, 6, -1.2]
    - [5.0, 20]
    - [80.0, 6, 1.2]
  hy:
    - [80.0, 6, -1.2]
    - [5.0, 17]
    - [80.0, 6, 1.2]
  hz:
    - [80.0, 8]
    - [5.0, 7]
    - [1.0, 4]
    - [1.0, 1]
    - [80.0, 3]
  origin: [-1003.2723199999998, -1005.7723199999998, -680.0]

model:
  require_layer_boundary_alignment: true
  layers:
    - top: 1000000000.0
      bottom: 0.0
      sigma_infinity: 1.0e-8
    - top: 0.0
      bottom: -40.0
      sigma_infinity: 0.012
      debye_terms:
        - delta_sigma: 0.002
          tau: 0.001
    - top: -40.0
      bottom: -1000000000.0
      sigma_infinity: 0.036
      debye_terms:
        - delta_sigma: 0.006
          tau: 0.001

receiver_line:
  x: [-20.0, 0.0, 20.0]
  y: 10.0
  z: -0.5
  components: [Ex, Ey, Hz]

solver:
  type: pardiso

source:
  start: [-25.0, 0.0, -0.5]
  end: [25.0, 0.0, -0.5]
  current: 1.0
  face_projection: axis_aligned
  waveform:
    type: step_off
    off_time: 0.0
    on_value: 1.0

time_steps:
  - [1.0e-05, 100]
