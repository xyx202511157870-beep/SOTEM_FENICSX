coordinate_system: z_up

mesh:
  # Coarse demonstration mesh. Use finer core cells and larger padding for
  # quantitative production runs.
  hx: [[10.0, 3, -1.25], [5.0, 16], [10.0, 3, 1.25]]
  hy: [[10.0, 3, -1.25], [5.0, 8], [10.0, 3, 1.25]]
  hz: [[20.0, 3], [5.0, 8], [20.0, 3]]
  origin: [-87.65625, -67.65625, -100.0]

model:
  require_layer_boundary_alignment: true
  fit_frequencies: [0.1, 0.3, 1.0, 3.0, 10.0, 30.0, 100.0, 300.0]
  layers:
    - top: 1000000000.0
      bottom: 0.0
      sigma_infinity: 1.0e-8
    - top: 0.0
      bottom: -40.0
      sigma_infinity: 0.01
    - top: -40.0
      bottom: -1000000000.0
      sigma_infinity: 0.03
      ip_model:
        type: pelton
        rho0: 40.0
        chargeability: 0.25
        tau: 0.02
        c: 0.7
        tau_grid: [0.0005, 0.002, 0.01, 0.05, 0.2]

boundary:
  kind: cpml
  thickness_cells: 2
  sigma_max: 50.0
  alpha_max: 0.0
  kappa_max: 1.0
  power: 2.0

source:
  start: [-25.0, 0.0, -0.5]
  end: [25.0, 0.0, -0.5]
  current: 1.0
  waveform:
    type: step_off
    off_time: 0.0
    on_value: 1.0

time_steps:
  - 0.001
  - 0.001
  - 0.005
  - 0.005

receiver_line:
  x: [-20.0, 0.0, 20.0]
  y: 10.0
  z: -0.5
  components: [Ex, Ey, Hz]
