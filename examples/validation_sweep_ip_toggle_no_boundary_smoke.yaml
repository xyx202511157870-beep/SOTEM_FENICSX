cases:
  - name: layered_ip_no_boundary_dt1ms
    overrides:
      boundary:
        kind: none
      magnetic_receiver_mode: current_biot
      magnetic_recovery_subdivisions: 1
      magnetic_recovery_polarization_scale: low_frequency_ratio
      time_steps:
        - [0.001, 12]

  - name: layered_noip_no_boundary_dt1ms
    overrides:
      model:
        require_layer_boundary_alignment: true
        layers:
          - top: 1000000000.0
            bottom: 0.0
            sigma_infinity: 1.0e-8
          - top: 0.0
            bottom: -40.0
            sigma_infinity: 0.01
          - top: -40.0
            bottom: -1000000000.0
            sigma_infinity: 0.03
      boundary:
        kind: none
      magnetic_receiver_mode: current_biot
      magnetic_recovery_subdivisions: 1
      magnetic_recovery_polarization_scale: low_frequency_ratio
      time_steps:
        - [0.001, 12]
