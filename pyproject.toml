[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atem3d"
version = "0.1.0"
description = "Three-solver seepage-channel TDEM comparison using SimPEG, FEniCSx, and empymod."
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "discretize",
  "simpeg",
  "empymod",
  "pymatsolver",
  "PyYAML",
  "h5py",
  "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
