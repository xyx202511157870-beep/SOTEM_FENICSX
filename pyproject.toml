[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sotem-ip"
version = "0.1.0"
description = "Utilities for short-offset electric-source TEM induced-polarization modelling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
empymod = ["empymod>=2.4"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["sotem_ip*"]

